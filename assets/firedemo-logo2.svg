<svg xmlns="http://www.w3.org/2000/svg"
     width="450"
     height="82"
     viewBox="0 0 450 82"
     role="img"
     aria-label="FireDemo">

  <defs>
    <!-- Red → orange → yellow fire gradient -->
    <linearGradient id="fireGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">
      <stop offset="0%"   stop-color="#7a0000"/>
      <stop offset="18%"  stop-color="#d00000"/>
      <stop offset="40%"  stop-color="#ff3d00"/>
      <stop offset="62%"  stop-color="#ff8500"/>
      <stop offset="82%"  stop-color="#ffc400"/>
      <stop offset="100%" stop-color="#fff000"/>
    </linearGradient>

    <!-- Lightning gradient -->
    <linearGradient id="lightningGradient"
                    x1="0%"
                    y1="100%"
                    x2="100%"
                    y2="0%">
      <stop offset="0%"   stop-color="#ff7a00"/>
      <stop offset="55%"  stop-color="#ffd000"/>
      <stop offset="100%" stop-color="#fffbd0"/>
    </linearGradient>

    <filter id="fireGlow"
            x="-30%"
            y="-40%"
            width="160%"
            height="180%">
      <feGaussianBlur stdDeviation="2.5"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow"
            x="-20%"
            y="-30%"
            width="140%"
            height="170%">
      <feOffset dx="1.5" dy="2"
                 result="offset"/>
      <feGaussianBlur in="offset"
                      stdDeviation="1.5"
                      result="shadowBlur"/>
      <feFlood flood-color="#260000"
               flood-opacity="0.95"
               result="shadowColor"/>
      <feComposite in="shadowColor"
                    in2="shadowBlur"
                    operator="in"
                    result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

<!-- Fire glow on the left -->
<path d="M 31,75
         C 13,64 14,48 25,37
         C 23,51 34,52 35,39
         C 37,27 48,24 45,10
         C 61,27 63,42 54,52
         C 50,57 51,63 58,67
         C 50,74 41,77 31,75
         Z"
      fill="url(#fireGradient)"
      opacity="0.8"
      filter="url(#fireGlow)"/>

<!-- Main fire graphic -->
<path d="M 31,75
         C 13,64 14,48 25,37
         C 23,51 34,52 35,39
         C 37,27 48,24 45,10
         C 61,27 63,42 54,52
         C 50,57 51,63 58,67
         C 50,74 41,77 31,75
         Z"
      fill="url(#fireGradient)"
      stroke="#a51b00"
      stroke-width="1.2"
      stroke-linejoin="round"/>

<!-- Inner yellow flame -->
<path d="M 35,69
         C 26,61 28,52 35,46
         C 34,55 41,56 41,47
         C 42,40 47,36 45,29
         C 55,42 53,54 47,60
         C 44,64 46,68 49,70
         C 44,72 39,72 35,69
         Z"
      fill="#fff000"
      opacity="0.9"
      filter="url(#fireGlow)"/>

<!-- Lightning glow on the right -->
<path d="M 408,8
         L 384,43
         L 400,43
         L 389,75
         L 426,32
         L 410,32
         Z"
      fill="url(#lightningGradient)"
      opacity="0.75"
      filter="url(#fireGlow)"/>

<!-- Main lightning bolt -->
<path d="M 408,8
         L 384,43
         L 400,43
         L 389,75
         L 426,32
         L 410,32
         Z"
      fill="url(#lightningGradient)"
      stroke="#ff5a00"
      stroke-width="1.2"
      stroke-linejoin="round"/>

  <!-- Dark text silhouette -->
  <text x="225"
        y="59"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="57"
        font-style="italic"
        font-weight="bold"
        letter-spacing="-2"
        fill="#260000"
        stroke="#260000"
        stroke-width="5">
    FireDemo
  </text>

  <!-- Main logo text -->
  <text x="225"
        y="57"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="57"
        font-style="italic"
        font-weight="bold"
        letter-spacing="-2"
        fill="url(#fireGradient)"
        stroke="#8f1600"
        stroke-width="1.2"
        paint-order="stroke fill"
        filter="url(#textShadow)">
    FireDemo
  </text>

  <!-- Warm text highlight -->
  <text x="225"
        y="56"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="57"
        font-style="italic"
        font-weight="bold"
        letter-spacing="-2"
        fill="none"
        stroke="#ffb000"
        stroke-width="0.55"
        opacity="0.8"
        filter="url(#fireGlow)">
    FireDemo
  </text>

  <!-- Short fiery underline -->
<path d="M 82,70
         C 150,69 300,69 368,70"
      fill="none"
      stroke="#5c0900"
      stroke-width="5"
      stroke-linecap="round"/>

<path d="M 82,68
         C 150,67 300,67 368,68"
      fill="none"
      stroke="url(#fireGradient)"
      stroke-width="2.2"
      stroke-linecap="round"
      filter="url(#fireGlow)"/>
</svg>